<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: Chromium on Android shrinks the page when the on-screen keyboard opens
         (by default it only covers it), so bottom-anchored UI like the chat sheet stays visible. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Installable as an app: Android/Chrome read the manifest; iOS uses the apple-* tags
         (Share > Add to Home Screen). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#a3201b" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nhà Chang" />
    <title></title>
    <script>
      // Apply the saved (or system) theme and language before first paint; mirrors src/theme.ts and src/i18n.
      (function () {
        var theme, locale;
        try {
          theme = localStorage.getItem('vg:theme');
          locale = localStorage.getItem('vg:locale');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        if (locale === 'en') document.documentElement.lang = 'en';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
